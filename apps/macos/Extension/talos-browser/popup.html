<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px -apple-system, BlinkMacSystemFont, sans-serif; width: 340px; margin: 0; padding: 14px; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  .muted { color: #888; font-size: 11px; }
  .status { margin: 8px 0; padding: 7px 8px; border-radius: 7px; background: rgba(128,128,128,.12); }
  textarea { width: 100%; box-sizing: border-box; height: 64px; resize: vertical; font: inherit; padding: 7px; border-radius: 7px; border: 1px solid rgba(128,128,128,.35); background: transparent; }
  .row { display: flex; gap: 7px; margin-top: 8px; }
  button { font: inherit; padding: 5px 9px; border-radius: 7px; border: 1px solid rgba(128,128,128,.35); background: transparent; cursor: pointer; }
  button.primary { background: #cc8745; border-color: #cc8745; color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  pre { white-space: pre-wrap; word-break: break-word; max-height: 150px; overflow: auto; margin: 8px 0 0; padding: 8px; border-radius: 7px; background: rgba(128,128,128,.12); font-size: 11px; }
  .error { color: #c0392b; }
</style>
</head>
<body>
  <h1>Talos</h1>
  <div class="muted">Send this page to the Talos app.</div>
  <div id="status" class="status">Checking Talos…</div>
  <textarea id="prompt">Summarize this page and list the key points.</textarea>
  <div class="row">
    <button id="ask" class="primary">Ask Talos</button>
    <button id="save">Save Page</button>
    <button id="cancel">Cancel</button>
  </div>
  <div class="row">
    <button id="ping">Ping host</button>
    <button id="open">Open Talos</button>
  </div>
  <pre id="output">No response yet.</pre>
  <script src="popup.js"></script>
</body>
</html>
