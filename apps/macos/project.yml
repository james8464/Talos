name: Talos
options:
  bundleIdPrefix: app.talos
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    ENABLE_HARDENED_RUNTIME: NO
targets:
  TalosNativeHost:
    type: tool
    platform: macOS
    sources:
      - path: NativeHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.talos.nativehost
        PRODUCT_NAME: TalosNativeHost
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

  TalosMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../mobile/TalosMobile
    info:
      path: ../mobile/TalosMobile/Info.plist
      properties:
        CFBundleDisplayName: Talos Remote
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.talos.mobile
        PRODUCT_NAME: TalosMobile
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        SWIFT_EMIT_LOC_STRINGS: YES

  TalosMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../mobile/TalosMobileUITests
    dependencies:
      - target: TalosMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.talos.mobile.uitests
        TEST_TARGET_NAME: TalosMobile
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

  TalosToolParser:
    type: library.static
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ToolParser
    settings:
      base:
        PRODUCT_NAME: TalosToolParser
        PRODUCT_BUNDLE_IDENTIFIER: app.talos.toolparser
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

  TalosTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
    dependencies:
      - target: TalosToolParser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.talos.macos.tests
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

  TalosCLI:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: CLI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.talos.cli
        PRODUCT_NAME: talos
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

  TalosRemoteDaemon:
    type: tool
    platform: macOS
    sources:
      - path: RemoteDaemon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.talos.remotedaemon
        PRODUCT_NAME: TalosRemoteDaemon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

  Talos:
    type: application
    platform: macOS
    sources:
      - path: Talos
    dependencies:
      - target: TalosToolParser
    info:
      path: Talos/Info.plist
      properties:
        CFBundleDisplayName: Talos
        CFBundleName: Talos
        CFBundleIconFile: Talos
        CFBundleShortVersionString: "0.3.0"
        CFBundleVersion: "3"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: ""
        NSMicrophoneUsageDescription: "Talos uses the microphone for local dictation into the composer."
        NSSpeechRecognitionUsageDescription: "Talos transcribes your speech into the composer using macOS Speech."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.talos.macos
        PRODUCT_NAME: Talos
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "3"
        COMBINE_HIDPI_IMAGES: YES
schemes:
  TalosTests:
    build:
      targets:
        TalosToolParser: all
        TalosTests: [test]
    test:
      config: Debug
      targets:
        - TalosTests

  TalosCLI:
    build:
      targets:
        TalosCLI: all
    run:
      config: Debug
  TalosMobile:
    build:
      targets:
        TalosMobile: all
        TalosMobileUITests: [test]
    test:
      config: Debug
      targets:
        - TalosMobileUITests
    run:
      config: Debug
  Talos:
    build:
      targets:
        Talos: all
        TalosNativeHost: all
        TalosRemoteDaemon: all
        TalosCLI: all
    run:
      config: Debug
