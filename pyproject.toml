[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "talos-assistant"
version = "0.2.0"
description = "Local, self-improving Mac assistant with voice, memory and computer use"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
voice = [
    "pipecat-ai[kokoro,mlx-whisper,ollama,runner,webrtc,whisper]==1.16.0",
]
tui = ["rich>=13", "prompt-toolkit>=3"]
vision = ["lancedb", "openai-clip", "torch", "numpy", "pillow"]
control = [
    "pyobjc-framework-Cocoa>=10.0",
    "pyobjc-framework-Quartz>=10.0",
    "pyobjc-framework-ApplicationServices>=10.0",
    "computer-harness @ git+https://github.com/huytieu/computer-harness@cea3a9459d08e1eeafefe0fc4b6c2fa39dc31129",
    "macos-computer-use-kit>=0.3.2",
]
dev = ["ruff>=0.9", "pytest>=8"]

[project.scripts]
talos = "talos_core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["talos_core"]

[tool.hatch.build.targets.wheel.force-include]
"agent.py" = "agent.py"
"run_talos.py" = "run_talos.py"

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = [
    ".venv",
    "venv",
    "state",
    "models",
    "generated_images",
    "graphify-out",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E402",   # scripts intentionally configure sys.path before local imports
    "E501",   # prose and command strings are allowed to run long
    "E701",   # compact one-line guards are used throughout the runtime
    "B008",   # dataclass and argparse defaults
    "B905",   # explicit zip lengths are already covered by tests
    "RUF001", "RUF002", "RUF003",
    "RUF005", "RUF007", "RUF012",
    "SIM105", # try/except/pass is deliberate for optional platform features
    "SIM108", "SIM117",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E731", "RUF059"]
"agent.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
