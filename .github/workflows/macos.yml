name: macOS

on:
  push:
    branches:
      - main
      - "talos/**"
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build Talos
        run: xcodebuild -project apps/macos/Talos.xcodeproj -scheme Talos -configuration Debug -derivedDataPath apps/macos/.build CODE_SIGNING_ALLOWED=NO build
      - name: Build Talos CLI
        run: xcodebuild -project apps/macos/Talos.xcodeproj -scheme TalosCLI -configuration Debug -derivedDataPath apps/macos/.build CODE_SIGNING_ALLOWED=NO build
      - name: Build Talos Mobile
        run: xcodebuild -project apps/macos/Talos.xcodeproj -scheme TalosMobile -configuration Debug -sdk iphonesimulator -derivedDataPath apps/macos/.build CODE_SIGNING_ALLOWED=NO build
      - name: Build Talos Mobile tests
        run: xcodebuild build-for-testing -project apps/macos/Talos.xcodeproj -scheme TalosMobile -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath apps/macos/.build CODE_SIGNING_ALLOWED=NO
