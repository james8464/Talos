name: Portable Talos tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18.0'
      - name: Install audio fixture codecs
        run: python -m pip install --only-binary=:all: av==16.0.1 numpy==2.2.6
      - name: Run fixture suite and real-minute reminder delivery
        env:
          TALOS_TEST_REAL_MINUTE: '1'
          TALOS_TEST_AUDIO_CODECS: '1'
        run: python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install 'ruff>=0.9'
      - name: Lint and self-check
        run: |
          ruff check .
          python -m talos_core.cli doctor --quick --no-lint

  native-room:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Replay the native room controller and interrupted spoken turns
        env:
          PYTHONPATH: tests:.
        run: python -m unittest -v test_native_room_flow test_spoken_stream.SpokenStreamFlow.test_native_first_clip_interrupt_and_replacement_turn test_voice_recovery.VoiceRecoveryTests.test_native_kokoro_failure_watchdog_and_cancellation
